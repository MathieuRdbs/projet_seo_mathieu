    <!-- main -->
<div class="container"><br>
  <h1 class="main-title mb-3 extra-title text-center " id="typed"></h1><br>
  <br>
    <form id="contactForm" style="width: 60%; margin-left: 20%;" novalidate>
    <div class="form-row">
      <div class="form-group col-md-6">
        <label for="Nom">Nom</label>
        <input type="text" class="form-control" id="Nom" placeholder="Votre Nom" required>
      </div>
      <div class="form-group col-md-6">
        <label for="Prenom">Prénom</label>
        <input type="text" class="form-control" id="Prenom" placeholder="Votre Prénom" required>
      </div>
    </div>
    <div class="form-group">
      <label for="Email">Email</label>
      <input type="email" class="form-control" id="Email" placeholder="xyz@domain.ext" required>
    </div>
    <div class="form-group">
      <label for="Telephone">Téléphone</label>
      <input type="tel" class="form-control" id="Telephone" required>
    </div>
    <div class="form-row">
      <div class="form-group col-12">
        <label for="Message">Votre Message</label>
        <textarea class="form-control" id="message" name="message" 
            style="width: 100%; max-width: 500px; height: 200px;" placeholder="Écrivez ici..." required></textarea> 
      </div>
    </div>
    <button type="submit" class="btn btn-secondary">Envoyer</button>
  </form>

  <!-- Zone de notification -->
  <div id="alertBox" class="mt-4"></div>
  
  <br>
  <hr>
  <div class="contact-info container my-5">
    <h1 class="main-title mb-3 extra-title text-center">Nos coordonnées </h1><br>
    <div class="row g-4">

      <div class="col-12 col-md-4">
        <div class="contact-card p-4 text-center shadow rounded">
          <i class="bi bi-telephone-fill icon mb-3 text-danger"></i>
          <h5>Téléphone</h5>
          <p>+212 7 77 91 26 36</p>
        </div>
      </div>

      <div class="col-12 col-md-4">
        <div class="contact-card p-4 text-center shadow rounded">
          <i class="bi bi-envelope-fill icon mb-3 text-danger"></i>
          <h5>Email</h5>
          <p>contact@seoagency.ma</p>
        </div>
      </div>

      <div class="col-12 col-md-4">
        <div class="contact-card p-4 text-center shadow rounded">
          <i class="bi bi-geo-alt-fill icon mb-3 text-danger" ></i>
          <h5>Adresse</h5>
          <p>123 Avenue Mohamed V, Casablanca</p>
        </div>
      </div>

    </div>
  </div>

  var typed = new Typed('#typed', {
    strings: ["Voulez-vous COLLABORER ? Contactez-nous dès maintenant chez SEO AGENCY !"],
